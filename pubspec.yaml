name: fhir_at_rest
description: FHIR RESTful API client for every FHIR version. Request builders for read, search, create, update, patch, delete, history, capabilities, transaction, batch and operations; response parsing over the fhir_node reflection contract.
version: 0.13.0
homepage: https://www.fhirfli.dev/
repository: https://github.com/fhir-fli/fhir_at_rest
issue_tracker: https://github.com/fhir-fli/fhir_at_rest/issues

topics:
  - fhir
  - hl7
  - healthcare
  - rest
  - interoperability

environment:
  sdk: ^3.7.0

dependencies:
  fhir_node: ^0.6.1
  http: ^1.6.0

dev_dependencies:
  test: ^1.29.0
  very_good_analysis: ^10.1.0
